services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/dataverse.db
      JWT_SECRET: change-me
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports: ["8000:8000"]
    volumes:
      - academy-data:/data

volumes:
  academy-data:
